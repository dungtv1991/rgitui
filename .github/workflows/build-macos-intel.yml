
name: Build rgitui macOS Intel DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Intel binary
        run: cargo build --release --target x86_64-apple-darwin

      - name: Verify Intel architecture
        run: |
          file target/x86_64-apple-darwin/release/rgitui

      - name: Create macOS app bundle
        run: |
          mkdir -p dist/rgitui.app/Contents/MacOS

          cp target/x86_64-apple-darwin/release/rgitui \
            dist/rgitui.app/Contents/MacOS/rgitui

          chmod +x dist/rgitui.app/Contents/MacOS/rgitui

          cat > dist/rgitui.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>rgitui</string>
            <key>CFBundleIdentifier</key>
            <string>com.rgitui.app</string>
            <key>CFBundleName</key>
            <string>rgitui</string>
            <key>CFBundleDisplayName</key>
            <string>rgitui</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleShortVersionString</key>
            <string>0.5.1</string>
            <key>NSPrincipalClass</key>
            <string>NSApplication</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG
        run: |
          mkdir -p dist/dmg

          cp -R dist/rgitui.app dist/dmg/
          ln -s /Applications dist/dmg/Applications

          hdiutil create \
            -volname "rgitui" \
            -srcfolder dist/dmg \
            -ov \
            -format UDZO \
            dist/rgitui-macos-intel.dmg

      - name: Verify DMG
        run: |
          test -f dist/rgitui-macos-intel.dmg
          hdiutil verify dist/rgitui-macos-intel.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: rgitui-macos-intel-dmg
          path: dist/rgitui-macos-intel.dmg
          if-no-files-found: error
